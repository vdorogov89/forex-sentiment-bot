name: Daily Forex Sentiment Report

on:
  schedule:
    # Runs every day at 06:00 UTC.
    # Adjust the hour to fit your timezone / preferred wake-up time.
    # (Helsinki is UTC+2 in winter / UTC+3 in summer, so 06:00 UTC = 08:00-09:00 local.)
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sentiment report script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sentiment_report.py
